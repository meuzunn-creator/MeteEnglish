<meta name="theme-color" content="#1899D6">
<title>Kelime Adaları – İngilizce Macera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24345A;--ink2:#5E6E8E;--ink3:#97A3B8;
  --mist:#EEF6FC;--line:#DCE6EF;--line2:#E8EEF4;--card:#fff;
  --leaf:#4CC22D;--leafd:#3A9A1F;--okbg:#DDF7CF;--oktx:#2E7D14;
  --sea:#1899D6;--sead:#1279AD;--seabg:#E1F3FD;
  --sun:#FFC21A;--sund:#E09E00;
  --coral:#FF5A5F;--corald:#D9383D;--badbg:#FFE3E3;--badtx:#C5282D;
  --lilac:#8E6CF0;--lilacd:#6F4FD1;
  --fd:'Baloo 2','Nunito',system-ui,sans-serif;
  --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);font-weight:700;color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #7CC6F2;outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--fd);font-weight:800;margin:0;line-height:1.15}
p{margin:0}
.i3d{width:var(--s,32px);height:var(--s,32px);object-fit:contain;display:inline-block;vertical-align:middle;flex:none;user-select:none;-webkit-user-drag:none}
.i3d.emo{display:inline-grid;place-items:center;font-size:calc(var(--s,32px)*.82);line-height:1;font-style:normal}

/* ---------- Kabuk ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;gap:32px;max-width:1280px;margin:0 auto;padding:0 24px;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;padding:22px 0;display:flex;flex-direction:column;gap:6px;border-right:2px solid var(--line);padding-right:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;--s:44px}
.brand b{font-family:var(--fd);font-size:25px;font-weight:800;color:var(--sea);line-height:1}
.navb{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:2px solid transparent;font-size:17px;font-weight:800;color:var(--ink2);--s:32px;text-align:left}
.navb:hover{background:#fff}
.navb.on{background:var(--seabg);border-color:#A9DBF7;color:var(--sead)}
.navb em{margin-left:auto;font-style:normal;background:var(--coral);color:#fff;font-size:12px;border-radius:99px;padding:1px 8px}
.main{padding:28px 0 90px;min-width:0}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 0;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.topm,.tabs{display:none}

.chips{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;--s:28px;padding:6px 8px;border-radius:12px}
.chip.fire{color:#F28C1B}.chip.xp{color:#D99400}.chip.brain{color:var(--lilac)}
.chip.off{color:var(--ink3)}.chip.off .i3d{filter:grayscale(1);opacity:.5}

.scard{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px}
.scard h3{font-size:20px;display:flex;align-items:center;gap:8px;--s:28px}
.scard p{color:var(--ink2);font-size:15px;margin-top:4px;line-height:1.4}
.scard .btn{margin-top:14px}
.goalrow{display:flex;align-items:center;gap:12px;margin-top:12px;--s:40px}
.goalrow .gtxt{flex:1}
.gbar{height:16px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.gbar.green i{background:var(--leaf)}
.ring{--p:0;width:86px;height:86px;border-radius:50%;flex:none;background:conic-gradient(var(--lilac) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center}
.ring b{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--fd);font-size:20px;color:var(--lilac);line-height:1;text-align:center}
.ring b small{display:block;font-family:var(--fb);font-size:11px;color:var(--ink3)}
.wordsum{display:flex;align-items:center;gap:16px;margin-top:10px}
.mascard{display:flex;align-items:flex-end;gap:10px;background:none;border:0;padding:0}
.mascard .mw{width:120px;flex:none}
.say{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.4;margin-bottom:40px}
.say::after{content:'';position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- Butonlar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:16px;font-weight:900;font-size:17px;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leafd);transition:transform .08s,box-shadow .08s,filter .15s;--s:26px;letter-spacing:.2px}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--leafd)}
.btn:disabled{background:#E3E8EE;color:#A6B1C2;box-shadow:0 5px 0 #CBD3DD}
.btn.blue{background:var(--sea);box-shadow:0 5px 0 var(--sead)}.btn.blue:active{box-shadow:0 1px 0 var(--sead)}
.btn.red{background:var(--coral);box-shadow:0 5px 0 var(--corald)}.btn.red:active{box-shadow:0 1px 0 var(--corald)}
.btn.lilac{background:var(--lilac);box-shadow:0 5px 0 var(--lilacd)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px;border-radius:13px}
.linkb{color:var(--sea);font-weight:900;font-size:15px}

/* ---------- Öğrenme yolu ---------- */
.mhero{display:none}
.unit{margin:0 auto 26px;max-width:580px}
.uhead{position:sticky;top:12px;z-index:6;background:var(--uc);color:#fff;border-radius:20px;padding:15px 18px 15px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--ud)}
.uhead .ut{flex:1;min-width:0}
.uhead small{display:block;font-size:14px;opacity:.85;font-weight:800}
.uhead h2{font-size:24px;margin:1px 0 2px}
.uhead p{font-size:14px;opacity:.95}
.guideb{flex:none;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.5);border-radius:14px;padding:8px 12px;color:#fff;font-weight:900;font-size:15px;--s:26px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.guideb:active{transform:translateY(2px);box-shadow:none}
.unit.locked .uhead{background:#B7C2D0;box-shadow:0 5px 0 #98A5B6}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;padding:66px 0 10px}
.nwrap{position:relative;z-index:1;transform:translateX(var(--x,0px))}
.nwrap.open{z-index:40}
.node{position:relative;width:78px;height:72px;border-radius:50%;background:var(--uc);box-shadow:0 8px 0 var(--ud);display:grid;place-items:center;--s:42px;transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ud)}
.node.lock{background:#E2E7ED;box-shadow:0 8px 0 #C5CED9}
.node.lock .i3d{filter:grayscale(1);opacity:.45}
.node.done .tick{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;background:var(--sun);border:3px solid #fff;color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 0 var(--sund)}
.node.big{width:92px;height:84px;--s:52px}
.node.cur::before{content:'';position:absolute;inset:-11px;border-radius:50%;border:6px solid var(--uc);opacity:.28;animation:ring 1.8s ease-out infinite}
.startt{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);color:var(--uc);padding:7px 14px;border-radius:12px;font-weight:900;font-size:15px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite;pointer-events:none;z-index:2}
.startt::after{content:'';position:absolute;left:50%;top:100%;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
.pop{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%);width:300px;max-width:82vw;background:var(--uc);color:#fff;border-radius:20px;padding:18px;z-index:20;box-shadow:0 6px 0 var(--ud),0 18px 30px rgba(20,40,80,.18);text-align:left;animation:popin .18s ease-out}
.pop::before{content:'';position:absolute;left:50%;top:-9px;width:18px;height:18px;background:var(--uc);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop h3{font-size:21px}
.pop p{font-size:15px;opacity:.95;margin:4px 0 14px;line-height:1.4}
.pop .btn{width:100%;background:#fff;color:var(--uc);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pop.lockp{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 10px 24px rgba(20,40,80,.12)}
.pop.lockp::before{background:#fff;border-left:2px solid var(--line);border-top:2px solid var(--line)}
.pop.lockp .btn{background:#E3E8EE;color:#A6B1C2;box-shadow:0 5px 0 #CBD3DD}
.uart{position:absolute;top:58px;--s:118px;pointer-events:none}
.uart.r{right:2%}.uart.l{left:2%}
.uart .cal{--s:96px}
.unit.locked .uart{filter:grayscale(1);opacity:.35}
.pathmas{position:absolute;width:86px;pointer-events:none}

/* ---------- Ders ekranı ---------- */
body.inlesson{background:#fff}
body.inlesson .app{display:block;max-width:none;padding:0}
body.inlesson .nav,body.inlesson .side,body.inlesson .topm,body.inlesson .tabs{display:none!important}
body.inlesson .main{padding:0}
.lesson{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#fff}
.lhead{display:flex;align-items:center;gap:16px;width:100%;max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 6px}
.lx{width:42px;height:42px;border-radius:12px;color:var(--ink3);font-size:28px;font-weight:900;display:grid;place-items:center;flex:none}
.lx:hover{background:var(--line2)}
.lbar{flex:1;height:18px;border-radius:99px;background:var(--line2);overflow:hidden}
.lbar i{position:relative;display:block;height:100%;min-width:18px;background:var(--leaf);border-radius:99px;transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.lbar i::after{content:'';position:absolute;left:9px;right:9px;top:4px;height:5px;border-radius:9px;background:rgba(255,255,255,.4)}
.lhearts{display:flex;align-items:center;gap:6px;color:var(--coral);font-weight:900;font-size:20px;--s:30px;flex:none}
.combo{display:flex;align-items:center;gap:4px;color:#F28C1B;font-weight:900;font-size:18px;--s:24px;flex:none}
.lbody{flex:1;display:flex;justify-content:center;padding:18px 20px 30px}
.ex{width:100%;max-width:640px;display:flex;flex-direction:column;gap:22px}
.ex-t{font-size:32px;color:var(--ink)}
.ex-tag{display:inline-flex;align-items:center;gap:6px;color:var(--lilac);font-weight:900;font-size:15px;--s:22px;margin-bottom:-12px}
.prompt{display:flex;align-items:flex-end;gap:12px}
.prompt .pm{width:96px;flex:none}
.prompt .pm .mascot{width:100%;height:auto;display:block}
.bubble{position:relative;border:2px solid var(--line);border-radius:20px;padding:14px 18px;font-size:24px;font-weight:800;display:flex;align-items:center;gap:14px;background:#fff;margin-bottom:18px;--s:56px;flex-wrap:wrap}
.bubble::before{content:'';position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .w{font-family:var(--fd);font-size:30px;line-height:1.1}
.bubble .w.tr{color:var(--ink)}
.bubble .w.sm{font-family:var(--fb);font-size:21px;line-height:1.3}
.bubble .cal{--s:56px}
.bigv{display:grid;place-items:center;--s:150px}
.bigv .cal{--s:130px}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:10px 0}
.spk{width:54px;height:54px;border-radius:15px;background:var(--sea);box-shadow:0 4px 0 var(--sead);display:grid;place-items:center;--s:32px;flex:none;transition:transform .08s}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sead)}
.spk.big{width:130px;height:130px;border-radius:30px;--s:70px;box-shadow:0 7px 0 var(--sead)}
.spk.slow{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);--s:30px}
.spk.big+.spk.slow{width:76px;height:76px;border-radius:20px;--s:44px}
.spk.talk{animation:talk .45s}
.mini{width:36px;height:36px;border-radius:11px;background:var(--seabg);display:inline-grid;place-items:center;--s:22px;flex:none;vertical-align:middle}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:18px 14px;min-height:80px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;line-height:1.25;transition:background .12s,border-color .12s,transform .08s}
.opt:hover:not(:disabled){background:#F7FAFD}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .k{position:absolute;left:10px;top:9px;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink3);display:grid;place-items:center;font-weight:900}
.opt.pic{min-height:178px;--s:110px;flex-direction:column}
.opt.pic .cal{--s:100px}
.opt.sel{border-color:#84CBF4;background:var(--seabg);color:var(--sead)}
.opt.sel .k{border-color:#84CBF4;color:var(--sead)}
.opt.right{border-color:#95D873;background:var(--okbg);color:var(--oktx)}
.opt.bad{border-color:#FFA3A6;background:var(--badbg);color:var(--badtx);animation:shake .4s}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mt{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;min-height:62px;padding:10px;font-size:19px;font-weight:800;line-height:1.2}
.mt.sel{border-color:#84CBF4;background:var(--seabg);color:var(--sead)}
.mt.ok{border-color:var(--line2);color:#C8D1DC;background:#fff;border-bottom-width:2px;transform:translateY(3px)}
.mt.bad{border-color:#FFA3A6;background:var(--badbg);color:var(--badtx);animation:shake .4s}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:66px;padding:4px 0}
.slot{width:46px;height:58px;border-bottom:4px solid #C9D3DF;display:grid;place-items:center;font-family:var(--fd);font-size:34px;font-weight:800;color:var(--ink)}
.slot.f{border-color:var(--sea)}
.slot.gap{width:14px;border:0}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{min-width:52px;height:56px;padding:0 15px;border:2px solid var(--line);border-bottom-width:5px;border-radius:15px;background:#fff;font-size:23px;font-weight:900;transition:transform .08s}
.tile:active:not(:disabled){transform:translateY(2px)}
.tile.used{background:var(--line2);color:transparent;border-color:var(--line2)}
.tile.w{font-size:20px;font-weight:800}
.zone{min-height:78px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:12px 0}
.zone .ph{color:var(--ink3);font-size:16px;align-self:center}
.zone.right{background:var(--okbg);border-radius:12px}
.zone.bad{background:var(--badbg);border-radius:12px}
.back{align-self:center;color:var(--ink2);font-weight:900;font-size:15px;padding:6px 12px;border-radius:10px;border:2px solid var(--line)}

.ansin{width:100%;min-height:130px;border:2px solid var(--line);border-radius:18px;background:#F7FAFD;font:inherit;font-size:26px;font-weight:800;color:var(--ink);padding:18px;resize:none;outline:none}
.ansin:focus{border-color:#84CBF4;background:#fff}
.ansin.right{border-color:#95D873;background:var(--okbg)}
.ansin.bad{border-color:#FFA3A6;background:var(--badbg)}

.micbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.mic{width:150px;height:150px;border-radius:50%;background:var(--lilac);box-shadow:0 8px 0 var(--lilacd);display:grid;place-items:center;--s:78px;position:relative}
.mic:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 var(--lilacd)}
.mic.on::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:8px solid var(--lilac);opacity:.3;animation:ring 1.1s ease-out infinite}
.mic:disabled{opacity:.6}
.heard{font-size:18px;color:var(--ink2);text-align:center;min-height:26px}
.heard b{color:var(--ink)}

.teach{border:2px solid var(--line);border-bottom-width:6px;border-radius:28px;padding:26px 22px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.teach .v{--s:150px}
.teach .cal{--s:130px}
.teach .en{font-family:var(--fd);font-size:50px;line-height:1.05;margin-top:6px}
.teach .tr{font-size:22px;color:var(--ink2)}
.teach .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.teach .ghint{background:#FFF6D8;border-radius:14px;padding:10px 14px;font-size:16px;color:#7A5A00;max-width:440px}
.gate{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px}
.gs{width:100%;max-width:440px;display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:17px;text-align:left;color:var(--ink3)}
.gs b{color:inherit}
.gs.now{border-color:#C4B4F7;background:#F6F2FF;color:var(--ink)}
.gs.ok{border-color:#95D873;background:var(--okbg);color:var(--oktx)}
.gn{width:30px;height:30px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-weight:900;flex:none;color:var(--ink2)}
.gs.now .gn{background:var(--lilac);color:#fff}.gs.ok .gn{background:var(--leaf);color:#fff}
.mic.sm{width:100px;height:100px;--s:52px;margin-top:6px}
.ovr{font-size:14px;color:var(--ink2);text-decoration:underline;padding:4px 8px}
.gline{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:16px;--s:22px;color:var(--ink)}
.gwait{color:var(--ink2);font-size:15px;max-width:420px}
.newtag{background:var(--lilac);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:900}

.lfoot{border-top:2px solid var(--line);padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);background:#fff}
.lfoot .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.lfoot .btn{min-width:180px}
.lfoot.ok{background:var(--okbg);border-color:transparent;animation:slideup .25s ease-out}
.lfoot.bad{background:var(--badbg);border-color:transparent;animation:slideup .25s ease-out}
.fb{display:flex;align-items:center;gap:16px;min-width:0}
.fb .fi{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;--s:44px;flex:none}
.fb h3{font-size:26px}
.lfoot.ok .fb h3{color:var(--oktx)}
.lfoot.bad .fb h3{color:var(--badtx)}
.fb .ft{font-size:17px;margin-top:2px;line-height:1.35}
.lfoot.ok .ft{color:var(--oktx)}
.lfoot.bad .ft{color:var(--badtx)}
.fb .ft small{display:block;font-size:14px;opacity:.85}
.lfoot.bad .btn{background:var(--coral);box-shadow:0 5px 0 var(--corald)}

/* ---------- Sonuç ---------- */
.done{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 34px) 20px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100vh;min-height:100dvh}
.done .dm{width:170px}
.done h1{font-size:40px;color:var(--ink)}
.done h1.ok{color:#E59A00}
.done .sub{color:var(--ink2);font-size:18px;max-width:460px;line-height:1.45}
.stars{display:flex;gap:6px;--s:56px}
.stars .off{filter:grayscale(1);opacity:.3}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:6px}
.dt{border:2px solid var(--tc);border-radius:18px;overflow:hidden;background:var(--tc)}
.dt small{display:block;color:#fff;font-size:13px;font-weight:900;padding:5px 4px}
.dt b{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border-radius:14px;padding:12px 4px;font-size:22px;color:var(--tc);--s:26px;font-family:var(--fd)}
.unlock{display:flex;align-items:center;gap:12px;background:#FFF6D8;border:2px solid #FFE08A;border-radius:18px;padding:10px 16px;font-size:17px;--s:44px;text-align:left}
.dlist{width:100%;text-align:left;margin-top:8px}
.dlist h3{font-size:20px;margin-bottom:8px}
.dbtns{display:flex;gap:12px;width:100%;margin-top:auto;padding-top:18px}
.dbtns .btn{flex:1}

/* ---------- Listeler ---------- */
.page{max-width:640px;margin:0 auto}
.page>h1{font-size:34px;margin-bottom:6px}
.page>.lead{color:var(--ink2);font-size:17px;margin-bottom:20px;line-height:1.45}
.wl{display:flex;flex-direction:column;gap:8px}
.wr{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;--s:44px}
.wr .cal{--s:44px}
.wr .wt{flex:1;min-width:0}
.wr .wt b{display:block;font-size:18px;overflow-wrap:anywhere}
.wr .wt span{color:var(--ink2);font-size:15px}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:18px;border-radius:4px;background:var(--line2)}
.pips i.on{background:var(--sun)}
.pips.full i.on{background:var(--leaf)}
.stt{font-size:12px;font-weight:900;border-radius:99px;padding:3px 9px;flex:none}
.stt.n{background:var(--line2);color:var(--ink2)}
.stt.l{background:#FFF1C9;color:#9A6B00}
.stt.d{background:var(--okbg);color:var(--oktx)}
details.ug{background:#fff;border:2px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
details.ug summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;--s:40px}
details.ug summary::-webkit-details-marker{display:none}
details.ug summary b{flex:1;font-size:18px}
details.ug summary span{color:var(--ink2);font-size:14px}
details.ug .wl{padding:0 12px 12px}
details.ug .wr{border-color:var(--line2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px;font-size:14px;color:var(--ink2);align-items:center}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pc{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;--s:56px;transition:transform .08s}
.pc:active:not(:disabled){transform:translateY(3px)}
.pc b{font-family:var(--fd);font-size:21px;margin-top:6px}
.pc span{color:var(--ink2);font-size:15px;line-height:1.35}
.pc em{font-style:normal;align-self:flex-start;background:var(--seabg);color:var(--sead);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:900;margin-top:4px}
.pc>div{display:flex;flex-direction:column;gap:4px}
.pc.hl{border-color:#C4B4F7;background:#F6F2FF}
.pc:disabled{opacity:.5}
.pc.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px}
.pc.wide>div{display:flex;flex-direction:column;gap:4px}
.pc.wide b{margin-top:0}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;--s:62px;font-size:16px;font-weight:900}
.badge small{color:var(--ink2);font-size:13px;font-weight:700;line-height:1.3}
.badge.off{opacity:.55}.badge.off .i3d{filter:grayscale(1)}

.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;font-size:17px}
.srow small{display:block;color:var(--ink2);font-size:13px;font-weight:700}
.inp{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);background:#F7FAFD;max-width:230px}
.sw{appearance:none;-webkit-appearance:none;width:56px;height:32px;border-radius:99px;background:#D3DCE6;position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw:checked{background:var(--leaf)}
.sw:checked::after{left:28px}
.srow.btns{background:none;border:0;padding:4px 0;justify-content:flex-start;flex-wrap:wrap}

/* kartlar */
.fcard{border:2px solid var(--line);border-bottom-width:6px;border-radius:28px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;--s:140px}
.fcard .cal{--s:120px}
.fcard .tr{font-family:var(--fd);font-size:36px;line-height:1.1}
.fcard .q{color:var(--ink2);font-size:17px}
.fcard .en{font-family:var(--fd);font-size:44px;color:var(--sea);line-height:1.05;display:flex;align-items:center;gap:12px}
.fcard .hidden{color:var(--ink3);font-size:20px;border:2px dashed var(--line);border-radius:14px;padding:12px 20px}

/* modal, toast */
.modal{position:fixed;inset:0;background:rgba(20,35,65,.5);display:grid;place-items:center;z-index:70;padding:16px;overflow:auto}
.modal.hidden{display:none}
.mbox{width:100%;max-width:560px;background:#fff;border-radius:26px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:popin .2s ease-out;max-height:calc(100dvh - 32px);overflow:auto}
.mbox h2{font-size:28px;margin-bottom:6px;display:flex;align-items:center;gap:10px;--s:40px}
.mbox .lead{color:var(--ink2);font-size:16px;line-height:1.45;margin-bottom:16px}
.mbox .mbtns{display:flex;gap:12px;margin-top:18px}
.mbox .mbtns .btn{flex:1}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:85;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:10px 18px 10px 12px;border-radius:16px;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:toastIn .3s ease-out;--s:32px;font-size:16px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.floatpt{position:fixed;font-family:var(--fd);font-weight:800;font-size:30px;color:#E59A00;pointer-events:none;animation:floatup 1.2s forwards;z-index:60}

/* açılış */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--sea);transition:opacity .45s,transform .45s;overflow:auto}
.splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.splash .box{text-align:center;max-width:560px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:16px}
.splash .art{position:relative;width:min(300px,70vw);--s:100%}
.splash .art .i3d{width:100%;height:auto;animation:bob 3.2s ease-in-out infinite}
.splash .art .mascot{position:absolute;width:34%;left:56%;top:30%}
.splash h1{font-size:clamp(46px,9vw,72px);line-height:1;letter-spacing:-.5px}
.splash .tag{font-size:20px;opacity:.95;max-width:420px;line-height:1.4}
.splash .btn{background:#fff;color:var(--sea);box-shadow:0 6px 0 #0D6C9C;font-size:21px;min-height:62px;padding:0 44px}
.splash .ioshint{font-size:14px;opacity:.9;background:rgba(255,255,255,.15);border-radius:14px;padding:10px 14px}

.mascot{width:100%;height:auto;display:block}
.mascot .arm{transform-box:fill-box;transform-origin:10% 90%;animation:wave 2.6s ease-in-out infinite}
.mascot .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.mascot.jump{animation:jump .7s}
.anim{animation:fadein .25s ease-out}

@keyframes ring{0%{transform:scale(.9);opacity:.45}100%{transform:scale(1.25);opacity:0}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.splash .art .i3d{animation-name:bob2}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes popin{from{opacity:0;transform:translateX(-50%) scale(.94)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.mbox{animation-name:popin2}
@keyframes popin2{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideup{from{transform:translateY(30px)}to{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes talk{50%{transform:scale(1.08)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}85%{transform:rotate(10deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{30%{transform:translateY(-14px)}60%{transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* takvim görseli */
.cal{--c:#ef4444;display:inline-flex;flex-direction:column;width:var(--s,96px);height:var(--s,96px);border-radius:22%;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px #E3E9F0,0 3px 0 #E3E9F0;vertical-align:middle;flex:none}
.cal b{display:block;height:28%;background:var(--c)}
.cal span{flex:1;display:grid;place-items:center;font-family:var(--fd);font-weight:800;color:var(--c);font-size:calc(var(--s,96px)*.3);line-height:1}

/* ---------- Duyarlı ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:84px minmax(0,1fr) 300px;gap:24px}
  .navb span,.brand b{display:none}
  .navb{justify-content:center;padding:10px}
  .navb em{position:absolute;margin:0 0 26px 30px}
  .brand{justify-content:center;padding:4px 0 18px}
  .nav{padding-right:12px}
}
@media (max-width:900px){
  .app{display:block;padding:0}
  .nav,.side{display:none}
  .topm{display:flex;position:sticky;top:0;z-index:30;background:#fff;border-bottom:2px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;align-items:center;justify-content:space-between}
  .topm .brand{padding:0;--s:34px}
  .topm .chips{gap:2px}
  .topm .chip{font-size:15px;--s:24px;padding:4px 6px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);justify-content:space-around}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;--s:30px;font-size:11.5px;font-weight:900;color:var(--ink3);border:2px solid transparent;position:relative}
  .tab.on{color:var(--sead);background:var(--seabg);border-color:#A9DBF7}
  .tab em{position:absolute;top:2px;right:14%;font-style:normal;background:var(--coral);color:#fff;font-size:10px;border-radius:99px;padding:0 6px}
  .main{padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 100px)}
  .mhero{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin:0 auto 20px;max-width:580px}
  .mhero .mw{width:64px;flex:none}
  .mhero .mt2{flex:1;min-width:0;font-size:15px}
  .mhero .mt2 b{font-family:var(--fd);font-size:20px;display:block}
  .uhead{top:72px}
}
@media (max-width:640px){
  .ex-t{font-size:25px}
  .ex{gap:16px}
  .lhead{gap:10px;padding-left:12px;padding-right:14px}
  .lbody{padding:10px 14px 20px}
  .prompt .pm{width:70px}
  .bubble{font-size:20px;padding:12px 14px;--s:46px}
  .bubble .w{font-size:25px}
  .bubble .w.sm{font-size:18px}
  .opts{gap:10px}
  .opt{min-height:68px;font-size:17px;padding:14px 10px}
  .opt.pic{min-height:140px;--s:84px}
  .opt .k{display:none}
  .opts.three{grid-template-columns:1fr}
  .mt{min-height:56px;font-size:16px}
  .slot{width:34px;height:48px;font-size:28px}
  .tile{min-width:44px;height:50px;font-size:21px;padding:0 12px}
  .tile.w{font-size:18px}
  .teach{padding:20px 14px}
  .teach .v{--s:120px}
  .teach .en{font-size:40px}
  .bigv{--s:120px}
  .mic{width:124px;height:124px;--s:62px}
  .ansin{font-size:22px;min-height:100px}
  .lfoot{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
  .lfoot .in{flex-direction:column;align-items:stretch;gap:12px}
  .lfoot .btn{width:100%;min-width:0}
  .lfoot .in>span:empty{display:none}
  .fb .fi{width:48px;height:48px;--s:34px}
  .fb h3{font-size:22px}
  .fb .ft{font-size:15px}
  .done h1{font-size:32px}
  .done .dm{width:130px}
  .tiles{gap:8px}
  .dt b{font-size:18px}
  .pgrid{grid-template-columns:1fr}
  .pc{flex-direction:row;align-items:center;gap:14px;--s:48px}
  .pc>div{display:flex;flex-direction:column;gap:2px}
  .pc b{margin-top:0;font-size:19px}
  .page>h1{font-size:28px}
  .uart{--s:84px;top:66px}
  .uart .cal{--s:70px}
  .uhead h2{font-size:21px}
  .guideb span{display:none}
  .fcard .tr{font-size:30px}
  .fcard .en{font-size:36px}
  .srow{flex-wrap:wrap}
  .wr .pips{display:none}
  .wr{gap:10px;padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>

/* ---------- Metin karşılaştırma ---------- */
function normEn(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/[.!?,;:"“”()]/g,' ').replace(/\s+/g,' ').trim();
}
function canon(s){
  let t=normEn(s);
  t=t.replace(/\b(it|he|she|what|who|that|where|there)'s\b/g,'$1 is').replace(/\bi'm\b/g,'i am')
     .replace(/\b(you|we|they)'re\b/g,'$1 are').replace(/\bcan't\b/g,'can not').replace(/\b(do|does|is|are)n't\b/g,'$1 not')
     .replace(/'/g,'').replace(/-/g,' ');
  return t.replace(/^(a|an|the) /,'').replace(/\s+/g,' ').trim();
}
const mkey=it=>it.g?'g:'+it.en.toLowerCase():canon(it.en);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function judgeText(ans,it){
  const a=canon(ans),t=canon(it.en);if(!a)return 'empty';if(a===t)return 'ok';
  const d=lev(a,t);if((t.length>=5&&d===1)||(t.length>=11&&d<=2))return 'almost';return 'bad';
}
function judgeSpeech(alts,it){
  const t=canon(it.en);let best=0;
  for(const al of alts){const a=canon(al);if(!a)continue;if(a===t)return 1;
    if((' '+a+' ').includes(' '+t+' '))return 1;
    best=Math.max(best,1-lev(a,t)/Math.max(a.length,t.length));}
  return best;
}

function micDenied(err){return err==='not-allowed'||err==='service-not-allowed'||err==='audio-capture';}
const trFlat=s=>s.toLocaleLowerCase('tr').replace(/[çğıöşü]/g,c=>({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u'}[c])).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const trNorm=s=>trFlat(String(s).replace(/\(.*?\)/g,' ')).replace(/[.!?;:"“”’'‘]/g,' ').replace(/\s+/g,' ').trim();
function trTargets(tr){const all=[trNorm(tr)];String(tr).replace(/\(.*?\)/g,' ').split(/[\/,]/).forEach(p=>{const n=trNorm(p);if(n&&!all.includes(n))all.push(n);});return all.filter(Boolean);}
function judgeTR(alts,it){
  const ts=trTargets(it.tr);let best=0;
  for(const al of alts){const a=trNorm(al);if(!a)continue;
    for(const t of ts){if(a===t||(' '+a+' ').includes(' '+t+' '))return 1;
      best=Math.max(best,1-lev(a,t)/Math.max(a.length,t.length));}}
  return best;
}
const enTh=it=>canon(it.en).length<=4?.6:.75;
const trTh=it=>Math.min(...trTargets(it.tr).map(t=>t.length))<=4?.6:.72;
/* Söyleme kapısı: mikrofon kullanılabiliyorsa söylemeden geçilemez */
const gateOn=()=>!!SR&&S.speech;
const needsTR=e=>e&&(e.type==='pic'||e.type==='picword')&&gateOn();
function gateOpen(e){
  if(!e||!gateOn())return true;
  if(e.type==='teach')return !!(e.g1&&e.g2);
  if(needsTR(e))return !e.answered||!!e.trSaid;
  return true;
}
function gateMic(){
  const e=cur();if(!e||UI.listening)return;
  const enStep=e.type==='teach'&&!e.g1;const lang=enStep?'en-US':'tr-TR';
  e.gmsg='';
  recognize((alts,err)=>{
    if(cur()!==e)return;
    if(micDenied(err)){S.speech=false;save();toast('Mikrofon izni verilmedi. Konuşma adımları kapatıldı.','🎙️');renderMain();return;}
    if(!alts||!alts.length){e.gfails=(e.gfails||0)+1;e.gmsg='Seni duyamadım. Mikrofona dokun ve yüksek sesle söyle.';renderMain();return;}
    const ok=enStep?judgeSpeech(alts,e.item)>=enTh(e.item):judgeTR(alts,e.item)>=trTh(e.item);
    if(ok){
      sfx('correct');e.gfails=0;
      if(enStep){e.g1=true;e.gmsg=`“${alts[0]}” Süper! Şimdi Türkçesini söyle.`;}
      else{if(e.type==='teach')e.g2=true;else e.trSaid=true;e.gmsg=`“${alts[0]}” Aferin!`;award('konus');}
    }else{e.gfails=(e.gfails||0)+1;sfx('wrong');e.gmsg=`“${alts[0]}” duydum. Bir daha dene!`;}
    renderMain();
  },lang);
  renderMain();
}

let G=null;

/* ---------- Alıştırma üretimi ---------- */
let EXID=0;
function distract(item,needE){
  const opts=[item];
  const nT=x=>x.toLocaleLowerCase('tr').replace(/\s*\(.*?\)/g,'').replace(/[.!?]/g,'').trim();
  const ok=c=>!c.g&&c!==item&&mkey(c)!==mkey(item)&&(!needE||hasPic(c))&&!opts.some(o=>canon(o.en)===canon(c.en)||nT(o.tr)===nT(c.tr)||(needE&&o.e===c.e));
  const long=isSent(item);
  const pools=[ALL.filter(c=>c.lv===item.lv),ALL.filter(c=>c.lv!==item.lv&&isSent(c)===long),ALL];
  for(const p of pools){for(const c of shuffle(p)){if(opts.length>=4)break;if(ok(c))opts.push(c);}}
  return shuffle(opts);
}
function fill(e){
  const it=e.item;
  Object.assign(e,{sel:null,built:[],answered:false,ok:null,almost:false,typed:'',heard:'',tries:0,retry:'',g1:false,g2:false,trSaid:false,gfails:0,gmsg:''});
  switch(e.type){
    case 'pic':case 'picword':e.opts=distract(it,true);break;
    case 'en2tr':case 'listen':case 'tr2en':e.opts=distract(it,false);break;
    case 'gram':e.opts=shuffle(it.opts);break;
    case 'spell':{
      const t=clean(it.en).toLowerCase();e.target=t;const letters=[...t.replace(/ /g,'')];
      const pool='abcdefghiklmnoprstuwy'.split('').filter(c=>!letters.includes(c));
      const extra=shuffle(pool).slice(0,letters.length>9?1:2);
      let tiles;let n=0;do{tiles=shuffle(letters.concat(extra));}while(tiles.join('').startsWith(letters.join(''))&&n++<10);
      e.tiles=tiles;break;}
    case 'order':{
      const words=clean(it.en).split(/\s+/);e.target=words;
      const have=new Set(words.map(w=>canon(w)));
      const cand=shuffle(ALL.filter(c=>c!==it&&isSent(c)&&!c.g)).sort((a,b)=>(b.lv===it.lv)-(a.lv===it.lv));
      const extra=[];for(const c of cand){for(const w of shuffle(clean(c.en).split(/\s+/))){const k=canon(w);if(k&&!have.has(k)){have.add(k);extra.push(w);break;}}if(extra.length>=2)break;}
      let tiles;let n=0;do{tiles=shuffle(words.concat(extra));}while(tiles.slice(0,words.length).join(' ')===words.join(' ')&&n++<10);
      e.tiles=tiles;break;}
    case 'match':{e.left=shuffle(e.items);e.right=shuffle(e.items);e.done=[];e.erred=[];e.pl=null;e.pr=null;e.bad=null;e.err=0;break;}
  }
  return e;
}
const mk=(type,item,extra)=>fill(Object.assign({id:++EXID,type,item},extra||{}));
const clone=e=>fill({id:e.id,type:e.type,item:e.item,items:e.items});
function matchEx(items){const pool=shuffle(items.filter(i=>!i.g)).filter((x,i,a)=>a.findIndex(y=>canon(y.en)===canon(x.en)||y.tr===x.tr)===i).slice(0,5);return pool.length>=3?mk('match',pool[0],{items:pool}):null;}
function interleave(list){
  const pool=shuffle(list),out=[];
  while(pool.length){let i=pool.findIndex(x=>!out.length||x.item!==out[out.length-1].item);if(i<0)i=0;out.push(pool.splice(i,1)[0]);}
  return out;
}
function recType(it){if(it.g)return 'gram';const t=['en2tr','listen','tr2en'];if(hasPic(it))t.push('pic','picword');return pick(t);}
function prodType(it,exam){
  if(it.g)return 'gram';
  if(canSpeak()&&Math.random()<(isSent(it)?.3:.45))return 'speak';
  if(isSent(it))return 'order';
  return exam||Math.random()<.5?'type':'spell';
}
const PLAN={
  learn(L){
    const Q=[],its=L.items;
    for(let i=0;i<its.length;i+=3){const g=its.slice(i,i+3);
      g.forEach(it=>Q.push(mk('teach',it)));
      shuffle(g).forEach(it=>Q.push(mk(it.g?'gram':hasPic(it)?'pic':'en2tr',it)));}
    const m=matchEx(its);if(m)Q.push(m);
    return Q;
  },
  practice(L){
    let Q=[];
    L.items.forEach(it=>{if(it.g){Q.push(mk('gram',it));return;}
      Q.push(mk(hasPic(it)&&Math.random()<.5?'picword':'tr2en',it));Q.push(mk('listen',it));});
    if(canSpeak())shuffle(L.items.filter(i=>!i.g)).slice(0,3).forEach(it=>Q.push(mk('say',it)));
    Q=interleave(Q);
    const m1=matchEx(L.items),m2=matchEx(L.items);
    if(m1)Q.splice(Math.floor(Q.length/2),0,m1);if(m2)Q.push(m2);
    return Q;
  },
  produce(L){
    const Q=[];
    L.items.forEach(it=>{if(it.g){Q.push(mk('gram',it));return;}
      Q.push(mk(isSent(it)?'order':'spell',it));
      Q.push(mk(canSpeak()?'speak':isSent(it)?'order':'type',it));});
    shuffle(L.items.filter(i=>!i.g&&!isSent(i))).slice(0,2).forEach(it=>Q.push(mk('dict',it)));
    return interleave(Q);
  },
  exam(L){
    const Q=[];
    L.items.forEach(it=>Q.push(mk(prodType(it,true),it)));
    shuffle(L.items.filter(i=>!i.g)).slice(0,Math.ceil(L.items.length/2)).forEach(it=>Q.push(mk('listen',it)));
    return interleave(Q);
  }
};
function planFinal(){
  const pool=LEVELS.filter(l=>!l.review).flatMap(l=>l.items);
  const uniq=[...new Map(pool.map(it=>[mkey(it),it])).values()];
  const items=[...new Set(weakest(uniq,14).concat(shuffle(uniq).slice(0,10)))].slice(0,20);
  const Q=items.map(it=>mk(prodType(it,true),it));
  shuffle(items.filter(i=>!i.g)).slice(0,6).forEach(it=>Q.push(mk('listen',it)));
  return interleave(Q);
}
function planMix(items){
  const Q=[];items.forEach(it=>{Q.push(mk(recType(it),it));Q.push(mk(prodType(it,false),it));});
  return interleave(Q);
}

/* ---------- Ders akışı ---------- */
function startNode(id,j){
  const L=LV(id);const st=stagesOf(L)[j];
  const queue=st.k==='final'?planFinal():PLAN[st.k](L);
  startLesson({kind:'unit',L,j,stage:st.k,title:st.n,queue,hearts:(st.k==='exam'||st.k==='final')?5:null});
}
function startPractice(kind){
  let items,queue,title;
  if(kind==='strong'){items=weakest(seenItems(),8);title='Güçlendir';queue=planMix(items);}
  else if(kind==='wrong'){items=shuffle(Object.keys(S.wrong).map(k=>WORDS[k]).filter(Boolean)).slice(0,8);title='Yanlışlarım';queue=planMix(items);}
  else if(kind==='speak'){items=weakest(seenItems().filter(i=>!i.g),8);title='Konuşma pratiği';queue=interleave(items.flatMap(it=>[mk('say',it),mk('speak',it)]));}
  else if(kind==='listen'){items=weakest(seenItems().filter(i=>!i.g),8);title='Dinleme pratiği';queue=interleave(items.flatMap(it=>[mk('listen',it),mk(isSent(it)?'order':'dict',it)]));}
  if(!items||!items.length){toast(kind==='wrong'?'Hiç yanlışın yok, harika!':'Önce haritadan bir ders bitir.','🎉');return;}
  startLesson({kind:'practice',pk:kind,title,queue,hearts:null});
}
function startLesson(o){
  stopRec();
  G=Object.assign(o,{pos:0,ids:new Set(o.queue.map(e=>e.id)),doneIds:new Set(),correct:0,wrong:0,combo:0,best:0,xp:0,t0:Date.now(),seen:new Map()});
  o.queue.forEach(e=>(e.items||[e.item]).forEach(it=>G.seen.set(mkey(it),it)));
  UI.screen='lesson';loadEx();
}
const cur=()=>G&&G.queue[G.pos];
function loadEx(){
  const e=cur();UI.heard='';UI.listening=false;UI.anim=true;render();
  if(['teach','pic','en2tr','listen','dict','say'].includes(e.type))setTimeout(()=>{if(cur()===e&&!e.answered)speak(e.item.en,false,$('.lbody .spk'));},350);
  if(['type','dict'].includes(e.type)&&matchMedia('(pointer:fine)').matches)setTimeout(()=>{const i=$('#ans');i&&i.focus();},60);
}
function isReady(e){
  switch(e.type){
    case 'spell':return e.built.length===e.target.replace(/ /g,'').length;
    case 'order':return e.built.length>0;
    case 'type':case 'dict':{const i=$('#ans');return !!(i&&i.value.trim());}
    default:return e.sel!=null;
  }
}
function check(){
  const e=cur();if(!e||e.answered||['teach','match','speak','say'].includes(e.type))return;
  const it=e.item;
  if(['type','dict'].includes(e.type)){
    const v=($('#ans')||{}).value||'';if(!v.trim())return;e.typed=v;
    const r=judgeText(v,it);return grade(e,r!=='bad',r==='almost');
  }
  if(!isReady(e))return;
  let ok;
  if(e.type==='spell')ok=e.built.map(i=>e.tiles[i]).join('')===e.target.replace(/ /g,'');
  else if(e.type==='order')ok=canon(e.built.map(i=>e.tiles[i]).join(' '))===canon(e.target.join(' '));
  else if(e.type==='gram')ok=e.opts[e.sel]===it.a;
  else ok=e.opts[e.sel]===it;
  grade(e,ok);
}
function grade(e,ok,almost){
  e.answered=true;e.ok=ok;e.almost=!!almost;
  const prod=PROD.has(e.type)||(e.type==='gram'&&['produce','exam','final'].includes(G.stage));
  if(e.type!=='match')bump(e.item,ok,prod);
  if(ok){
    G.correct++;G.combo++;G.best=Math.max(G.best,G.combo);G.doneIds.add(e.id);G.xp+=prod?3:2;S.totalCorrect++;
    G.praise=pick(PRAISE);sfx('correct');if(G.combo>=5)award('seri5');
  }else{
    G.wrong++;G.combo=0;sfx('wrong');
    if(G.hearts!=null)G.hearts--;
    if(G.hearts==null||G.hearts>0)G.queue.push(clone(e));
  }
  save();renderMain();
  if(e.type!=='match')setTimeout(()=>speak(e.type==='gram'?e.item.a:e.item.en),ok?450:650);
}
function next(){
  if(!G)return;
  if(G.hearts!=null&&G.hearts<=0)return finishLesson(false);
  G.pos++;
  if(G.pos>=G.queue.length)return finishLesson(true);
  loadEx();
}
function finishLesson(pass){
  stopRec();
  const g=G;g.pass=pass;g.secs=Math.round((Date.now()-g.t0)/1000);g.unlocked=null;g.newStars=0;
  let bonus=0;
  if(pass){
    bonus=10+(g.wrong===0?5:0);
    if(g.kind==='unit'){
      const L=g.L,nx=LEVELS[LEVELS.indexOf(L)+1],wasOpen=nx?unitOpen(nx):true;
      if(prog(L)<=g.j)S.prog[L.id]=g.j+1;
      if(g.stage==='exam'||g.stage==='final'){
        const st=g.wrong===0?3:g.wrong<=2?2:1;S.stars[L.id]=Math.max(S.stars[L.id]||0,st);g.newStars=st;bonus+=15;
        if(st===3)award('yildiz3');if(g.stage==='final')award('hepsi');
      }
      if(doneUnits()>=1)award('ada1');
      if(doneUnits()>=Math.ceil(LEVELS.length/2))award('yarim');
      if(nx&&!wasOpen&&unitOpen(nx))g.unlocked=nx;
    }else award('tekrar');
    award('ilk');
  }
  g.bonus=bonus;addXP(g.xp+bonus);
  if(learnedCount()>=25)award('kelime25');
  UI.screen='done';UI.anim=true;save();render();
  if(pass){sfx('win');confetti();}else sfx('wrong');
}
function quitLesson(){
  confirmBox('Dersten çıkmak istiyor musun?','Bu dersteki ilerlemen kaydedilmez ama kelimelerde öğrendiklerin ve puanların sende kalır.',()=>{stopRec();G=null;goScreen('home');});
}

/* --- eşleştirme --- */
function matchPick(side,i){
  const e=cur();if(!e||e.answered||e.bad)return;
  const items=side==='L'?e.left:e.right;if(e.done.includes(items[i]))return;
  if(side==='L'){e.pl=i;speak(e.left[i].en);}else e.pr=i;
  sfx('select');
  if(e.pl!=null&&e.pr!=null){
    const a=e.left[e.pl],b=e.right[e.pr];
    if(a===b){e.done.push(a);e.pl=e.pr=null;
      if(e.done.length===e.items.length){e.items.forEach(x=>bump(x,!e.erred.includes(x),false));setTimeout(()=>grade(e,true),250);}
    }else{
      e.err++;e.erred.push(a,b);sfx('wrong');e.bad=[e.pl,e.pr];e.pl=e.pr=null;
      setTimeout(()=>{e.bad=null;renderMain();},500);
    }
  }
  renderMain();
}
/* --- konuşma --- */
function micStart(){
  const e=cur();if(!e||e.answered||UI.listening)return;
  e.retry='';recognize((alts,err)=>{
    if(cur()!==e||e.answered)return;
    if(micDenied(err)){S.speech=false;save();toast('Mikrofon izni verilmedi. Konuşma alıştırmalarını Ayarlar\'dan açabilirsin.','🎙️');convertSpeak();return;}
    if(!alts||!alts.length){e.retry='Seni duyamadım. Mikrofona dokun ve yüksek sesle söyle.';renderMain();return;}
    const sim=judgeSpeech(alts,e.item),th=canon(e.item.en).length<=4?.6:.75;e.heard=alts[0];
    if(sim>=th){award('konus');grade(e,true);}
    else{e.tries++;if(e.tries<2){e.retry=`“${alts[0]}” duydum. Bir daha dene!`;sfx('wrong');renderMain();}else grade(e,false);}
  });
  renderMain();
}
function convertSpeak(){
  stopRec();
  G.queue.forEach((x,i)=>{if(i>=G.pos&&!x.answered&&(x.type==='speak'||x.type==='say')){x.type=x.type==='say'?'listen':isSent(x.item)?'order':'type';fill(x);}});
  renderMain();
}

/* --- kartlarla sor-bakalım --- */
function startCards(list,title){
  list=list.filter(i=>!i.g);
  if(!list.length){toast('Önce haritadan bir ders bitir.','📒');return;}

function cardAnswer(known){
  const c=UI.cards,it=c.list[c.i];
  bump(it,known,known);if(known){c.ok++;addXP(1);sfx('correct');}else sfx('wrong');save();
  c.i++;c.show=false;c.heard='';if(c.i>=c.list.length){c.end=true;award('tekrar');sfx('win');}

function cardMic(){
  const c=UI.cards;if(!c||c.show||UI.listening)return;const it=c.list[c.i];
  recognize((alts,err)=>{
    if(UI.cards!==c)return;
    if(micDenied(err)){S.speech=false;save();toast('Mikrofon izni verilmedi.','🎙️');renderMain();return;}
    if(!alts){c.heard='Seni duyamadım, bir daha dene.';renderMain();return;}
    const sim=judgeSpeech(alts,it),th=canon(it.en).length<=4?.6:.75;
    c.show=true;c.heard=`“${alts[0]}” duydum.`;
    if(sim>=th){award('konus');c.auto=true;cardAnswer(true);toast('Doğru söyledin!','🥳');}

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if(RM)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#4CC22D','#FFC21A','#1899D6','#8E6CF0','#EC4F87','#F2851B'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*8+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx+Math.sin(t/20+p.a)*.6;p.y+=p.vy;p.vy+=.03;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();});if(++t<240)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}

      b=`<textarea id="ans" class="ansin${e.answered?(e.ok?' right':' bad'):''}" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="İngilizce yaz…" ${e.answered?'disabled':''}>${esc(e.typed)}</textarea>`;break;
    case 'dict':tag='Kendin yaz';t='Duyduğunu İngilizce yaz';p=`<div class="listen">${spk(it.en,true)}${slowBtn(it.en)}</div>`;
      b=`<textarea id="ans" class="ansin${e.answered?(e.ok?' right':' bad'):''}" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Duyduğunu yaz…" ${e.answered?'disabled':''}>${esc(e.typed)}</textarea>`;break;
    case 'speak':case 'say':{tag='Sesli söyle';
      t=e.type==='speak'?'İngilizcesini sesli söyle':'Duyduğunu sesli tekrar et';
      p=e.type==='speak'?bubble(`${vis(it)}<span class="w tr">${esc(it.tr)}</span>`):bubble(`${spk(it.en)}<span class="w">${esc(it.en)}</span>`);
      const msg=UI.listening?'Dinliyorum, şimdi söyle!':e.answered?(e.heard?`Duyduğum: <b>${esc(e.heard)}</b>`:''):e.retry?esc(e.retry):'Mikrofona dokun ve söyle';
      b=`<div class="micbox"><button class="mic${UI.listening?' on':''}" data-a="mic" ${e.answered?'disabled':''} aria-label="Konuş">${im('🎙️')}</button><div class="heard">${msg}</div></div>`;break;}
  }
  return `${tag?`<span class="ex-tag">${im(e.type==='speak'||e.type==='say'?'🎙️':'✏️')}${tag}</span>`:''}<h1 class="ex-t">${t}</h1>${p}${b}`;
}
function lessonFoot(e){
  if(e.type==='teach'){const ok=gateOpen(e);return `<footer class="lfoot"><div class="in">${ok?'<span></span>':'<span class="gwait">İngilizcesini ve Türkçesini söyleyince devam edebilirsin.</span>'}<button class="btn" data-a="cont" ${ok?'':'disabled'}>Devam</button></div></footer>`;}
  if(!e.answered){
    if(e.type==='match')return `<footer class="lfoot"><div class="in"><span></span><button class="btn" disabled>Kontrol et</button></div></footer>`;
    if(e.type==='speak'||e.type==='say')return `<footer class="lfoot"><div class="in"><button class="btn ghost" data-a="nospeak">Şimdi konuşamıyorum</button><button class="btn lilac" data-a="mic" ${UI.listening?'disabled':''}>${im('🎙️')}Konuş</button></div></footer>`;
    return `<footer class="lfoot"><div class="in"><span></span><button class="btn" id="chk" data-a="check" ${isReadyStatic(e)?'':'disabled'}>Kontrol et</button></div></footer>`;
  }
  const it=e.item,en=e.type==='gram'?it.a:it.en;
  const needT=needsTR(e)&&!e.trSaid;
  const nextBtn=needT?`<button class="btn lilac" data-a="gmic" ${UI.listening?'disabled':''}>${im('🎙️')}${UI.listening?'Dinliyorum…':'Türkçesini söyle'}</button>`:'<button class="btn" data-a="next">Devam</button>';
  const gl=needsTR(e)?`<div class="gline">${im('🎙️')}<span>${e.trSaid?`Türkçesini söyledin: <b>${esc(it.tr)}</b> ✓`:`Şimdi anlamını Türkçe söyle: <b>${esc(it.tr)}</b>`}</span></div>${e.gmsg&&!e.trSaid?`<small>${esc(e.gmsg)}</small>`:''}${needT&&e.gfails>=3?'<button class="ovr" data-a="govr">Yetişkin onayı ile geç</button>':''}`:'';
  const line=e.type==='match'?(e.err?`${e.err} kez karıştırdın ama hepsini buldun.`:'Hepsini ilk denemede buldun!'):`<b>${esc(en)}</b> = ${esc(it.tr)} ${e.type!=='gram'?miniSay(en):''}`;
  if(e.ok){
    const title=e.almost?'Neredeyse oldu!':G.praise;
    const extra=e.almost?`<small>Küçük bir yazım hatası var. Doğrusu yukarıda.</small>`:G.combo>=3?`<small>${G.combo} doğru üst üste!</small>`:'';
    return `<footer class="lfoot ok"><div class="in"><div class="fb"><span class="fi">${im(e.almost?'😉':'🥳')}</span><div><h3>${title}</h3><div class="ft">${line}${extra}${gl}</div></div></div>${nextBtn}</div></footer>`;
  }
  const yours=e.typed?`<small>Senin yazdığın: ${esc(e.typed)}</small>`:e.heard?`<small>Duyduğum: ${esc(e.heard)}</small>`:'';
  const later=G.hearts==null||G.hearts>0?'<small>Bu soruyu birazdan tekrar soracağım.</small>':'';
  return `<footer class="lfoot bad"><div class="in"><div class="fb"><span class="fi">${im('😢')}</span><div><h3>Doğru cevap:</h3><div class="ft">${line}${yours}${later}${gl}</div></div></div>${nextBtn}</div></footer>`;
}
function isReadyStatic(e){if(e.type==='type'||e.type==='dict')return !!e.typed;return isReady(e);}
function vLesson(){
  const e=cur();const pct=Math.max(3,Math.round(G.doneIds.size/G.ids.size*100));
  return `<div class="lesson"><header class="lhead"><button class="lx" data-a="quit" aria-label="Dersten çık">✕</button>
  <div class="lbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  ${G.combo>=3?`<span class="combo">${im('🔥')}${G.combo}</span>`:''}${G.hearts!=null?`<span class="lhearts">${im(G.hearts>0?'❤️':'💔')}${G.hearts}</span>`:''}</header>
  <div class="lbody"><div class="ex${UI.anim?' anim':''}">${lessonBody(e)}</div></div>${lessonFoot(e)}</div>`;
}
function vDone(){
  const g=G,tot=g.correct+g.wrong,acc=tot?Math.round(g.correct/tot*100):100;
  const exam=g.stage==='exam'||g.stage==='final';
  const title=!g.pass?'Canların bitti':g.stage==='final'?'Büyük sınavı geçtin!':exam?'Ada sınavını geçtin!':g.kind==='practice'?'Tekrar tamam!':'Ders tamam!';
  const sub=!g.pass?'Üzülme! Hata yaptığın kelimeleri Tekrar bölümünde çalış, sonra yeniden dene.'
    :exam?`${esc(g.L.name)} adasındaki kelimeleri artık Türkçesini görünce İngilizce söyleyebiliyorsun.`
    :g.kind==='practice'?'Tekrar yaptıkça kelimeler hafızana kazınıyor.':'Bu derste çalıştığın kelimeler güçlendi. Sıradaki derse geç!';
  const items=[...g.seen.values()];
  const mm=Math.floor(g.secs/60),ss=String(g.secs%60).padStart(2,'0');
  return `<div class="done anim"><div class="dm">${mascotSVG(g.pass?'happy':'sad',g.pass?'jump':'')}</div>
  ${exam&&g.pass?`<div class="stars">${[1,2,3].map(i=>im('⭐',i<=g.newStars?'':'off')).join('')}</div>`:''}
  <h1 class="${g.pass?'ok':''}">${title}</h1><p class="sub">${sub}</p>
  <div class="tiles"><div class="dt" style="--tc:#E59A00"><small>Puan</small><b>${im('⭐')}${g.xp+g.bonus}</b></div>
  <div class="dt" style="--tc:#3A9A1F"><small>Doğruluk</small><b>${acc}%</b></div>
  <div class="dt" style="--tc:#1279AD"><small>Süre</small><b>${mm}:${ss}</b></div></div>
  ${g.unlocked?`<div class="unlock">${im(g.unlocked.icon)}<span>Yeni ada açıldı: <b>${esc(g.unlocked.name)}</b></span></div>`:''}
  <div class="dlist"><h3>Çalıştığın kelimeler</h3><div class="wl">${items.map(wordRow).join('')}</div></div>
  <div class="dbtns">${g.pass?`<button class="btn wide" data-a="donego">Devam et</button>`:`<button class="btn ghost" data-a="nav" data-v="practice">Tekrar yap</button><button class="btn" data-a="retry">Yeniden dene</button>`}</div></div>`;
}
function vCards(){
  const c=UI.cards;
  if(c.end)return `<div class="done anim"><div class="dm">${mascotSVG('happy','jump')}</div><h1 class="ok">${c.ok} / ${c.list.length} bildin!</h1>
    <p class="sub">${c.ok===c.list.length?'Hepsini İngilizce söyleyebildin. Harikasın!':'Bilemediklerin Güçlendir tekrarında karşına çıkacak.'}</p>
    <div class="dbtns"><button class="btn ghost" data-a="nav" data-v="practice">Bitir</button><button class="btn" data-a="cards">Yeni kartlar</button></div></div>`;
  const it=c.list[c.i],pct=Math.round(c.i/c.list.length*100);
  return `<div class="lesson"><header class="lhead"><button class="lx" data-a="nav" data-v="practice" aria-label="Çık">✕</button><div class="lbar"><i style="width:${Math.max(3,pct)}%"></i></div><span class="combo" style="color:var(--ink2)">${c.i+1}/${c.list.length}</span></header>
  <div class="lbody"><div class="ex${UI.anim?' anim':''}"><h1 class="ex-t">Sor bakalım</h1>
  <div class="fcard">${vis(it)}<div class="tr">${esc(it.tr)}</div><div class="q">İngilizcesi ne? Sesli söyle!</div>
  ${c.show?`<div class="en">${esc(it.en)} ${miniSay(it.en)}</div>`:`<div class="hidden">Cevap gizli</div>`}
  ${c.heard?`<div class="heard">${esc(c.heard)}</div>`:''}</div></div></div>
  <footer class="lfoot"><div class="in">${c.show?`<button class="btn red" data-a="cardno">Bilemedim</button><button class="btn" data-a="cardyes">Bildim</button>`
    :`${canSpeak()?`<button class="btn lilac" data-a="cardmic" ${UI.listening?'disabled':''}>${im('🎙️')}${UI.listening?'Dinliyorum…':'Söyleyerek dene'}</button>`:'<span></span>'}<button class="btn blue" data-a="cardshow">Cevabı göster</button>`}</div></footer></div>`;
}
function vGuide(L){
  return `<h2>${im(L.icon)}${esc(L.name)}</h2><p class="lead">Bu adadaki kelimeler. 🔊 ile dinle. Çubuklar kelimeyi ne kadar iyi bildiğini gösterir.</p>
  <div class="wl">${L.items.map(wordRow).join('')}</div>
  <div class="mbtns"><button class="btn ghost" data-a="close">Kapat</button><button class="btn lilac" data-a="cardsunit" data-v="${L.id}">Sor bakalım</button></div>`;
}
function vSplash(){
  return `<div class="box"><div class="art">${im('🏝️')}${mascotSVG('happy')}</div>
  <h1>Kelime Adaları</h1><p class="tag">İngilizce kelimeleri dinle, yaz, söyle. Her adayı geçtiğinde o kelimeler artık senin!</p>
  <button class="btn" data-a="start">${S.totalCorrect?'Devam et':'Başlayalım'}</button>
  ${IOS&&!STANDALONE?`<div class="ioshint">Tam ekran için Safari'de Paylaş, sonra "Ana Ekrana Ekle".</div>`:''}</div>`;
}
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

/* ---------- Render ---------- */
const FOCUS=['lesson','done','cards'];
function renderMain(){
  const m=$('#main');
  const V={home:vHome,practice:vPractice,words:vWords,badges:vBadges,settings:vSettings,lesson:vLesson,done:vDone,cards:vCards};
  const keep=document.activeElement&&document.activeElement.id==='ans'?{v:document.activeElement.value}:null;
  m.innerHTML=(V[UI.screen]||vHome)();
  if(keep){const i=$('#ans');if(i&&!i.disabled){i.value=keep.v;i.focus();}}
  if(UI.anim&&!FOCUS.includes(UI.screen)){m.classList.remove('anim');void m.offsetWidth;m.classList.add('anim');}
  UI.anim=false;
  if(UI.screen==='home'&&UI.scrollCur){UI.scrollCur=false;requestAnimationFrame(()=>{const n=$('.node.cur');if(n)n.scrollIntoView({block:'center',behavior:'auto'});});}
}
function render(){
  document.body.classList.toggle('inlesson',FOCUS.includes(UI.screen));
  if(!FOCUS.includes(UI.screen)){renderNav();renderSide();}
  renderMain();
}
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="mbox">${html}</div>`;m.classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML='';}
function confirmBox(title,text,fn){UI.confirmFn=fn;openModal(`<h2>${esc(title)}</h2><p class="lead">${esc(text)}</p><div class="mbtns"><button class="btn ghost" data-a="no">Vazgeç</button><button class="btn red" data-a="yes">Evet</button></div>`);}
function goScreen(s){stopRec();UI.screen=s;UI.anim=true;UI.pop=null;if(s==='home')UI.scrollCur=true;window.scrollTo(0,0);render();}

/* ---------- Olaylar ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  const el=e.target.closest('[data-a]');
  if(UI.pop&&UI.screen==='home'&&!e.target.closest('.nwrap')){UI.pop=null;renderMain();if(!el)return;}
  if(!el||el.disabled)return;
  const a=el.dataset.a,v=el.dataset.v;
  ac();
  if(!['say','sayslow','opt','tile','untile','check','mL','mR','mic','gmic','cardmic','backsp'].includes(a))sfx('click');
  switch(a){
    case 'start':$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),500);musicStart();speak('Welcome to Word Islands!');break;
    case 'nav':if(UI.screen==='lesson'&&G){quitLesson();break;}G=null;UI.cards=null;goScreen(v);break;
    case 'node':{UI.pop=UI.pop===v?null:v;renderMain();break;}
    case 'startnode':{const [id,j]=v.split(':').map(Number);UI.pop=null;startNode(id,j);break;}
    case 'guide':openModal(vGuide(LV(+v)));break;
    case 'cardsunit':startCards(LV(+v).items,'');break;
    case 'cards':{const s=seenItems();startCards(s.length?weakest(s,40):[],'');break;}
    case 'cardshow':UI.cards.show=true;stopRec();renderMain();speak(UI.cards.list[UI.cards.i].en);break;
    case 'cardyes':cardAnswer(true);break;
    case 'cardno':cardAnswer(false);break;
    case 'cardmic':cardMic();break;
    case 'pr':startPractice(v);break;
    case 'say':speak(v,false,el.classList.contains('spk')?el:null);break;
    case 'sayslow':speak(v,true,el);break;
    case 'opt':{const ex=cur();if(ex&&!ex.answered){ex.sel=+v;sfx('select');if(ex.type!=='gram'&&['tr2en','picword'].includes(ex.type))speak(ex.opts[ex.sel].en);renderMain();}break;}
    case 'tile':{const ex=cur();if(ex&&!ex.answered&&!ex.built.includes(+v)){ex.built.push(+v);sfx('select');if(ex.type==='order')speak(ex.tiles[+v]);renderMain();}break;}
    case 'untile':{const ex=cur();if(ex&&!ex.answered){ex.built.splice(+v,1);sfx('click');renderMain();}break;}
    case 'backsp':{const ex=cur();if(ex&&!ex.answered){ex.built.pop();sfx('click');renderMain();}break;}
    case 'mL':matchPick('L',+v);break;
    case 'mR':matchPick('R',+v);break;
    case 'check':check();break;
    case 'next':if(!gateOpen(cur())){gateBlock();break;}next();break;
    case 'gmic':gateMic();break;
    case 'govr':gateOverride();break;
    case 'cont':{const ex=cur();if(!gateOpen(ex)){gateBlock();break;}G.doneIds.add(ex.id);stopRec();next();break;}
    case 'mic':micStart();break;
    case 'trysay':{const ex=cur();recognize((alts,err)=>{if(micDenied(err)){S.speech=false;save();toast('Mikrofon izni verilmedi.','🎙️');renderMain();return;}
      if(!alts){toast('Seni duyamadım, bir daha dene.','🎙️');return;}
      const sim=judgeSpeech(alts,ex.item);toast(sim>=.7?'Süper söyledin!':`“${alts[0]}” duydum. Bir daha dinle ve dene.`,sim>=.7?'🥳':'🎧');if(sim>=.7)sfx('correct');});toast('Dinliyorum, şimdi söyle!','🎙️');break;}
    case 'nospeak':S.speechOff=Date.now()+15*60*1000;save();toast('Tamam, 15 dakika konuşma sorusu sormayacağım.','👍');convertSpeak();break;
    case 'quit':quitLesson();break;
    case 'donego':{const g=G;G=null;const c=current();UI.screen='home';UI.anim=true;UI.scrollCur=true;UI.pop=g&&g.kind==='unit'&&c?c.L.id+':'+c.j:null;window.scrollTo(0,0);render();break;}
    case 'retry':{const g=G;if(g.kind==='unit')startNode(g.L.id,g.j);else startPractice(g.pk);break;}
    case 'close':closeModal();break;
    case 'no':closeModal();UI.confirmFn=null;break;
    case 'yes':{const f=UI.confirmFn;UI.confirmFn=null;closeModal();if(f)f();break;}
    case 'testvoice':speak('Hello! Welcome to Word Islands.');break;
    case 'testmic':toast('Dinliyorum, "hello" de!','🎙️');recognize((alts,err)=>{if(micDenied(err))toast('Mikrofon izni verilmedi.','🔒');else toast(alts?`Duyduğum: “${alts[0]}”`:'Ses duyulmadı.','🎙️');});break;
    case 'reset':confirmBox('İlerleme silinsin mi?','Tüm puanlar, kelime güçleri, yıldızlar ve rozetler silinecek.',()=>{
      const keep={sound:S.sound,music:S.music,voice:S.voice,name:S.name};S=Object.assign(fresh(),keep);save();G=null;goScreen('home');toast('İlerleme sıfırlandı.','🗑️');});break;
  }
});
function onSet(e){
  const k=e.target.dataset.set;if(!k)return;
  S[k]=e.target.type==='checkbox'?e.target.checked:k==='goal'?+e.target.value:e.target.value;
  if(k==='speech'&&S.speech)S.speechOff=0;
  save();
  if(k==='music'){S.music?musicStart():musicStop();}
  if(k!=='name'){renderNav();renderSide();if(k==='allOpen')renderMain();}
}
document.addEventListener('change',onSet);
document.addEventListener('input',e=>{
  if(e.target.dataset.set==='name')onSet(e);
  if(e.target.id==='ans'){const b=$('#chk');if(b)b.disabled=!e.target.value.trim();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')){closeModal();return;}
  if(UI.screen!=='lesson'||!G||!$('#modal').classList.contains('hidden')||$('#splash'))return;
  const ex=cur();
  if(e.key==='Enter'){e.preventDefault();if((ex.type==='teach'||ex.answered)&&!gateOpen(ex)){gateBlock();return;}if(ex.type==='teach'){G.doneIds.add(ex.id);next();}else if(ex.answered)next();else check();return;}
  if(document.activeElement&&document.activeElement.id==='ans')return;
  if(!ex.answered&&ex.opts&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(i<ex.opts.length){ex.sel=i;sfx('select');renderMain();}}
});

$('#splash').innerHTML=vSplash();
render();

</script>
</body>
</html>
